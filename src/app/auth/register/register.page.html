<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <form #f="ngForm" (ngSubmit)="onRegister(f)">
          <ion-card>
            <ion-card-header>
              <ion-card-title>Créer un compte</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <div class="photo-preview">
                @if (photo) {
                <img [src]="photo" />
                } @else {
                <i>Aucune photo prise</i>
                }
              </div>
              <ion-button (click)="onPrendrePhoto()" fill="outline" expand="block">
                <ion-icon name="camera-outline" slot="start"></ion-icon>
                {{ photo ? 'Reprendre la photo' : 'Prendre une photo' }}
              </ion-button>

              <ion-item>
                <ion-input label="Nom" labelPlacement="floating" name="nom" ngModel required></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Prénom" labelPlacement="floating" name="prenom" ngModel required></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Âge" labelPlacement="floating" type="number" name="age" ngModel required></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Email" labelPlacement="floating" type="email"
                  name="email" ngModel required email></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Mot de passe (6 caractères min.)" labelPlacement="floating" type="password"
                  name="password" ngModel required minlength="6"></ion-input>
              </ion-item>

              <ion-button class="ion-margin-top" type="submit" expand="block" color="secondary" [disabled]="f.invalid">
                <ion-icon name="person-add-outline" slot="start"></ion-icon>
                Créer mon compte
              </ion-button>
            </ion-card-content>
          </ion-card>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
