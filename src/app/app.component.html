<ion-app>
  <!-- SideDrawer : affiché seulement quand l'utilisateur est connecté -->
  <ion-menu contentId="main" [disabled]="!authSer.isLoggedIn()">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      @if (authSer.currentUser; as user) {
      <ion-item lines="full">
        <ion-avatar slot="start">
          <img [src]="user.photo" />
        </ion-avatar>
        <ion-label>
          <h2>{{ user.prenom }} {{ user.nom }}</h2>
          <p>{{ user.age }} ans @if (user.role === 'admin') { · Admin }</p>
        </ion-label>
      </ion-item>
      }
      <ion-list>
        <ion-menu-toggle>
          <ion-item routerLink="/films" routerDirection="root" button>
            <ion-icon name="film-outline" slot="start"></ion-icon>
            <ion-label>Films</ion-label>
          </ion-item>
          <ion-item routerLink="/favoris" routerDirection="root" button>
            <ion-icon name="heart-outline" slot="start"></ion-icon>
            <ion-label>Ma playlist</ion-label>
          </ion-item>
          <ion-item routerLink="/matching" routerDirection="root" button>
            <ion-icon name="people-outline" slot="start"></ion-icon>
            <ion-label>Matching</ion-label>
          </ion-item>
          @if (authSer.isAdmin()) {
          <ion-item routerLink="/admin" routerDirection="root" button>
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Administration</ion-label>
          </ion-item>
          }
          <ion-item (click)="onLogout()" button>
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Déconnexion</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
